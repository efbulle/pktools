version: 2
updates:
  # Dépendances Python gérées par uv (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Hooks pre-commit (.pre-commit-config.yaml)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(pre-commit)"
    open-pull-requests-limit: 10
    groups:
      pre-commit:
        patterns:
          - "*"

  # Actions utilisées dans les workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
