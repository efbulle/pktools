name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev deps)
        run: uv sync --locked

      - name: Type check
        run: uv run pyright

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=pktools --cov-report=term-missing

      - name: Build package
        run: uv build

  optional-backends:
    name: Installation isolée (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pandas, polars]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build --wheel
      - run: uv venv .backend-env
      - run: uv pip install --python .backend-env/bin/python "$(echo dist/pktools-*.whl)[${{ matrix.backend }}]"
      - run: uv pip check --python .backend-env/bin/python
      - run: .backend-env/bin/python tests/optional_backend_smoke.py ${{ matrix.backend }}
