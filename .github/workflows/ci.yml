name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev deps)
        run: uv sync --locked

      - name: Type check
        run: uv run pyright

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=pktools --cov-report=term-missing

      - name: Build package
        run: uv build

  pandas-only:
    name: Installation pandas sans Polars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build --wheel
      - run: uv venv .pandas-only
      - run: uv pip install --python .pandas-only/bin/python "pandas>=2.2"
      - run: uv pip install --python .pandas-only/bin/python --no-deps dist/*.whl
      - name: Vérifier l'import et la conversion sans Polars
        run: |
          .pandas-only/bin/python -c "import importlib.util, sys; assert importlib.util.find_spec('polars') is None; import pandas as pd; from pktools.pandas import ext_to_m; assert ext_to_m(pd.Series(['4+514'])).iloc[0] == 4514; assert 'polars' not in sys.modules"
